name: Mirror Itch.io to Releases

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
 mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install gh -y

      - name: Install itch-downloader
        run: |
          curl -L https://github.com/BraedonWooding/itch-downloader/releases/latest/download/itch-downloader \
            -o /usr/local/bin/itch-downloader
          chmod +x /usr/local/bin/itch-downloader

      - name: Download uploads from itch.io
        run: |
          mkdir -p mirror
          itch-downloader dl \
            --api-key "${{ secrets.ITCH_API_KEY }}" \
            --output mirror

      - name: Generate release info
        id: release
        run: |
          TAG="mirror-$(date +'%Y-%m-%d_%H-%M-%S')"
          NAME="Mirror $(date +'%Y-%m-%d %H:%M:%S')"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ steps.release.outputs.tag }}" \
            --title "${{ steps.release.outputs.name }}"

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          i=1

          find mirror -maxdepth 1 -type f -print0 | sort -z |
          while IFS= read -r -d '' file; do
            base=$(basename "$file")
            newname=$(printf "%02d-%s" "$i" "$base")

            cp "$file" "/tmp/$newname"

            echo "Uploading $newname"

            gh release upload \
              "${{ steps.release.outputs.tag }}" \
              "/tmp/$newname"

            i=$((i+1))
          done